<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sebastian Rodriguez · Zombis</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1791549085">
<style>
  @font-face { font-family: "Bangers"; src: url("./lib/Bangers.woff2") format("woff2"); font-display: swap; } /* Google Fonts, licencia OFL */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0f0b2e; color: #fff; touch-action: none; user-select: none;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  canvas#escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .letra { font-family: Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; }
  #cargando { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center;
    font-size: 12px; letter-spacing: .3em; text-transform: uppercase; transition: opacity .5s, visibility 0s linear .5s; }
  body.listo #cargando { opacity: 0; visibility: hidden; }

  /* el borde rojo de cuando te lastiman */
  #dano { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(190,0,0,.75) 100%); }
  #mira { position: fixed; left: 50%; top: 50%; z-index: 55; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none;
    background: linear-gradient(#fff, #fff) center / 2px 100% no-repeat, linear-gradient(#fff, #fff) center / 100% 2px no-repeat;
    -webkit-mask: radial-gradient(circle, transparent 4px, #000 5px); mask: radial-gradient(circle, transparent 4px, #000 5px); opacity: .85; }
  #mira.cabeza { background: linear-gradient(#ff3a3a, #ff3a3a) center / 3px 100% no-repeat, linear-gradient(#ff3a3a, #ff3a3a) center / 100% 3px no-repeat; transform: scale(1.5); }
  #radar { position: fixed; left: 14px; top: 14px; z-index: 60; width: 130px; height: 130px; }
  #ronda { position: fixed; left: 20px; bottom: 12px; z-index: 60; font-size: 92px; line-height: 1; color: #c1121f; text-shadow: 0 3px 0 #000, 0 0 18px rgba(193,18,31,.7); }
  #puntos { position: fixed; right: 20px; bottom: 74px; z-index: 60; font-size: 40px; color: #ffd23c; text-shadow: 0 3px 0 #000; }
  #arma { position: fixed; right: 20px; bottom: 16px; z-index: 60; text-align: right; font: 700 14px monospace; color: #cfc8ff; text-shadow: 0 2px 0 #000; }
  #arma b { display: block; font: 400 34px Bangers, Impact, sans-serif; letter-spacing: .04em; color: #f4f1de; }
  #ventajas { position: fixed; left: 130px; bottom: 22px; z-index: 60; display: flex; gap: 8px; font-size: 26px; }
  #ventajas span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.6); border: 2px solid #ff8a1f; }
  #poderes { position: fixed; left: 50%; bottom: 110px; z-index: 60; transform: translateX(-50%); display: flex; gap: 10px; font: 700 13px monospace; }
  #poderes span { padding: 5px 12px; border-radius: 14px; background: rgba(0,0,0,.75); border: 1px solid #39ff14; color: #39ff14; }
  #pista { position: fixed; left: 50%; bottom: 58px; z-index: 60; transform: translateX(-50%); padding: 10px 20px; border-radius: 10px;
    background: rgba(0,0,0,.88); border: 1px solid rgba(255,255,255,.28); font-weight: 700; font-size: 17px; white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #pista.ver { opacity: 1; }
  #aviso { position: fixed; left: 50%; top: 26%; z-index: 70; transform: translate(-50%, -50%); font-size: 84px; color: #c1121f; white-space: nowrap;
    text-shadow: 0 5px 0 #000, 0 0 30px rgba(193,18,31,.7); opacity: 0; transition: opacity .5s; pointer-events: none; }
  #aviso.ver { opacity: 1; }
  #arriba { position: fixed; left: 50%; top: 14px; z-index: 60; transform: translateX(-50%); display: flex; gap: 10px; font: 700 13px monospace; color: #cfc8ff; }
  #arriba > * { padding: 5px 14px; border-radius: 14px; background: rgba(26,19,71,.85); border: 1px solid #4a3f96; color: #cfc8ff; text-decoration: none; }
  #creditos { position: fixed; left: 50%; bottom: 6px; z-index: 60; transform: translateX(-50%); font-size: 10px; color: #6f66a8; white-space: nowrap; }
  #ayuda { position: fixed; left: 50%; top: 52px; z-index: 60; transform: translateX(-50%); font-size: 12px; color: #b3abe0; white-space: nowrap; }
  #fin { position: fixed; left: 50%; top: 50%; z-index: 80; transform: translate(-50%, -50%) scale(.7); min-width: min(92vw, 380px);
    padding: 22px 30px; border-radius: 16px; text-align: center; background: rgba(0,0,0,.93); border: 2px solid #c1121f;
    box-shadow: 0 0 40px rgba(193,18,31,.6); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.2,1.6,.4,1); }
  #fin.ver { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  #fin h1 { font-weight: 400; font-size: 58px; color: #c1121f; }
  #fin p { margin: 8px 0 14px; font: 700 15px monospace; color: #cfc8ff; line-height: 1.7; }
  #fin button, .tactil { display: block; width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; border: 1px solid #4a3f96; background: #1a1347;
    color: #fff; font: 700 15px inherit; cursor: pointer; }
  #fin button:first-of-type { background: #c1121f; border-color: #c1121f; }
  .tactil { display: none; position: fixed; right: 16px; z-index: 65; width: 92px; touch-action: manipulation; }
  #bComprar { bottom: 210px; background: #ff8a1f; border-color: #ff8a1f; color: #1a0d02; }
  #bCambiar { bottom: 160px; }
  @media (pointer: coarse) { #bCambiar { display: block; } #ayuda { display: none; } #ronda { font-size: 64px; } }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>

<canvas id="escena"></canvas>
<div id="cargando">…</div>
<div id="dano"></div>
<div id="mira"></div>
<canvas id="radar" width="260" height="260"></canvas>

<div id="arriba"><a id="salir" href="./"></a><span id="mejor"></span><span id="fps">-- FPS</span></div>
<div id="ayuda"></div>
<div id="ronda" class="letra"></div>
<div id="ventajas"></div>
<div id="poderes"></div>
<div id="puntos" class="letra"></div>
<div id="arma"></div>
<div id="pista"></div>
<div id="aviso" class="letra"></div>
<div id="creditos"></div>
<button id="bComprar" class="tactil" type="button"></button>
<button id="bCambiar" class="tactil" type="button"></button>
<div id="fin"><h1 class="letra"></h1><p></p><button id="otra" type="button"></button><button id="volver" type="button"></button></div>

<script type="module" src="./zombis.js?v=33"></script>
</body>
</html>
