<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebastian Rodriguez · Portfolio</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1791549085">
<style>
  @font-face { font-family: "Bangers"; src: url("./lib/Bangers.woff2") format("woff2"); font-display: swap; } /* Google Fonts, licencia OFL */
  @font-face { font-family: "Pacifico"; src: url("./lib/Pacifico.woff2") format("woff2"); font-display: swap; } /* Google Fonts, licencia OFL */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0f0b2e; color: #fff;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  canvas#escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Fondo violeta-azul con polvo (preloader) ---------- */
  .polvo {
    background-color: #0f0b2e;
    background-image:
      radial-gradient(circle, rgba(200,190,255,.55) 0 1px, transparent 2px),
      radial-gradient(circle, rgba(170,160,255,.35) 0 1.5px, transparent 2.5px),
      radial-gradient(ellipse at 50% 40%, #2a1b6b 0, #0f0b2e 70%);
    background-size: 90px 90px, 140px 140px, 100% 100%;
    background-position: 0 0, 45px 70px, 0 0;
  }

  /* ---------- Preloader ---------- */
  #preloader {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .7s ease .2s, visibility 0s linear .9s;
  }
  /* el nombre en blanco, girando en círculo */
  #preloader svg { width: min(47vmin, 297px); height: auto; animation: girar 9s linear infinite; }
  #preloader text { fill: #fff; font: 700 18px "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #preloader p { position: absolute; font-size: 12px; letter-spacing: .3em; color: #fff; text-transform: uppercase; }
  #progreso { display: none; }
  @keyframes girar { to { transform: rotate(360deg); } }
  body.listo #preloader { opacity: 0; visibility: hidden; }

  /* ---------- Textos sobre la escena ---------- */
  #titulo { position: fixed; left: 18px; top: 16px; z-index: 60; font-weight: 900; font-size: 15px;
    letter-spacing: .3em; text-transform: uppercase; color: #f4f1de; }
  #titulo small { display: block; margin-top: 5px; font-weight: 600; font-size: 11px; letter-spacing: .22em; color: #b3abe0; }
  #ayuda { position: fixed; left: 16px; bottom: 16px; z-index: 60; font-size: 13px; color: #b3abe0; }
  #ayuda kbd { display: inline-block; min-width: 24px; padding: 3px 6px; margin-right: 2px; text-align: center;
    border: 1px solid #4a3f96; border-bottom-width: 3px; border-radius: 5px; background: #1a1347; color: #eee;
    font: 700 12px monospace; }
  #pista { position: fixed; left: 50%; bottom: 58px; z-index: 60; transform: translateX(-50%);
    padding: 11px 22px; border-radius: 10px; background: rgba(0,0,0,.88); border: 1px solid rgba(255,255,255,.28);
    color: #fff; font-weight: 700; font-size: 18px; letter-spacing: .02em; white-space: nowrap;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  #pista.ver { opacity: 1; }
  /* cartel de logro: letras rojas que brillan */
  #logro { position: fixed; left: 50%; top: 50%; z-index: 70; transform: translate(-50%, -50%) scale(.7); cursor: pointer;
    text-align: center; padding: 26px 46px; border-radius: 16px;
    background: rgba(0,0,0,.92); border: 2px solid #ff2a2a;
    box-shadow: 0 0 40px rgba(255,42,42,.6), inset 0 0 24px rgba(255,42,42,.25);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.2,1.6,.4,1); }
  #logro.ver { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; animation: latir .7s ease-in-out infinite; }
  #logro b { display: block; font-size: 54px; line-height: 1; filter: drop-shadow(0 0 14px #ffc93c); }
  #logro small { display: block; margin-top: 10px; font-size: 13px; letter-spacing: .4em; text-transform: uppercase;
    color: #ff5a5a; text-shadow: 0 0 10px #ff2a2a; }
  #logro strong { display: block; margin: 6px 0 4px; font: 400 56px Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em;
    color: #ff2a2a; text-shadow: 0 0 8px #ff2a2a, 0 0 24px #ff2a2a, 0 0 52px #ff0000; }
  #logro span { font-size: 14px; color: #ffb3b3; }
  @keyframes latir { 50% { box-shadow: 0 0 70px rgba(255,42,42,.95), inset 0 0 34px rgba(255,42,42,.4); } }
  #creditos { position: fixed; right: 12px; bottom: 10px; z-index: 60; font-size: 10px; color: #6f66a8; }
  #marcador { position: fixed; right: 16px; top: 14px; z-index: 60; display: flex; gap: 10px; align-items: center;
    font: 700 14px monospace; color: #cfc8ff; }
  #idiomas { display: flex; gap: 2px; padding: 3px !important; }
  #idiomas button { border: 0; border-radius: 10px; padding: 3px 8px; background: transparent; color: #a79fd6; font: 700 12px monospace; cursor: pointer; }
  #idiomas button:hover { color: #fff; }
  #idiomas button.activo { background: #4a3f96; color: #fff; }
  #marcador span { padding: 5px 10px; border-radius: 14px; background: rgba(26,19,71,.85); border: 1px solid #4a3f96; }
  #agarrar { display: none; position: fixed; right: 18px; bottom: 44px; z-index: 60; width: 84px; height: 84px;
    border-radius: 50%; border: 3px solid #4dff7c; background: rgba(10,107,58,.85); color: #fff;
    font: 700 13px inherit; touch-action: manipulation; }
  @media (pointer: coarse) { #agarrar { display: block; } #ayuda { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    #preloader svg { animation: none; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>

<canvas id="escena"></canvas>

<!-- Preloader -->
<div id="preloader">
  <svg viewBox="0 0 190 190" aria-label="Cargando">
    <defs><path id="circulo" d="M95,95 m-77,0 a77,77 0 1,1 154,0 a77,77 0 1,1 -154,0"/></defs>
    <text><textPath href="#circulo" textLength="484" lengthAdjust="spacing">SEBASTIAN ★ RODRIGUEZ ★ SEBASTIAN ★ RODRIGUEZ ★ </textPath></text>
  </svg>
  <i id="progreso"></i>
  <p id="estado"></p>
</div>

<div id="titulo">Sebastian Rodriguez<small>software hecho en el campo</small></div>
<div id="pista"></div>
<div id="logro"><b>🏆</b><small>Logro desbloqueado</small><strong>Cráneo de oro</strong><span>Abriendo mi WhatsApp…</span></div>
<div id="marcador"><span id="idiomas"></span><span id="pozo">🎃 0 · 💀 0</span><span id="fps">-- FPS</span></div>
<button id="agarrar" type="button">Agarrar</button>
<div id="ayuda"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> mover &nbsp;·&nbsp; <kbd>Espacio</kbd> agarrar / soltar &nbsp;·&nbsp; <kbd>Enter</kbd> abrir proyecto</div>
<div id="creditos">Granero y vaca: Quaternius (CC0)</div>

<script type="module" src="./juego.js?v=1791571434"></script>
</body>
</html>
