<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sebastian Rodriguez · Carrera</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1791549085">
<style>
  @font-face { font-family: "Bangers"; src: url("./lib/Bangers.woff2") format("woff2"); font-display: swap; } /* Google Fonts, licencia OFL */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0f0b2e; color: #fff; touch-action: none; user-select: none;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  canvas#escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .letra { font-family: Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; }

  #cargando { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center;
    font-size: 12px; letter-spacing: .3em; text-transform: uppercase; transition: opacity .5s, visibility 0s linear .5s; }
  body.listo #cargando { opacity: 0; visibility: hidden; }

  /* ---------- Marcador ---------- */
  #puesto { position: fixed; left: 18px; top: 10px; z-index: 60; font-size: 76px; line-height: 1; color: #ff8a1f; text-shadow: 0 3px 0 #000; }
  #puesto small { font-size: 30px; color: #f4f1de; }
  #datos { position: fixed; right: 16px; top: 14px; z-index: 60; display: flex; gap: 10px; font: 700 15px monospace; color: #cfc8ff; }
  #datos span { padding: 5px 12px; border-radius: 14px; background: rgba(26,19,71,.85); border: 1px solid #4a3f96; }
  #velocidad { position: fixed; right: 18px; bottom: 14px; z-index: 60; font-size: 54px; line-height: 1; color: #f4f1de; text-shadow: 0 3px 0 #000; text-align: right; }
  #velocidad small { font-size: 20px; color: #b3abe0; }
  #velocidad.turbo { color: #39ff14; }
  #mapa { position: fixed; left: 14px; bottom: 44px; z-index: 60; width: 170px; height: 170px; border-radius: 12px;
    background: rgba(10,7,32,.6); border: 1px solid #4a3f96; }
  #ayuda { position: fixed; left: 16px; bottom: 14px; z-index: 60; font-size: 12px; color: #b3abe0; }
  #salir { position: fixed; left: 50%; top: 14px; z-index: 60; transform: translateX(-50%); padding: 5px 14px; border-radius: 14px;
    background: rgba(26,19,71,.85); border: 1px solid #4a3f96; color: #cfc8ff; font: 700 13px monospace; text-decoration: none; }
  #salir:hover { color: #fff; }
  #pistas { position: fixed; left: 50%; top: 50px; z-index: 60; transform: translateX(-50%); display: flex; gap: 4px; padding: 3px; border-radius: 14px;
    background: rgba(26,19,71,.7); border: 1px solid #4a3f96; white-space: nowrap; max-width: 96vw; overflow-x: auto; }
  #pistas a { padding: 3px 9px; border-radius: 10px; color: #a79fd6; font: 700 11px monospace; text-decoration: none; }
  #pistas a:hover { color: #fff; }
  #pistas a.activo { background: #4a3f96; color: #fff; }

  /* ---------- Cuenta regresiva y cartel del final ---------- */
  #cuenta { position: fixed; left: 50%; top: 38%; z-index: 70; transform: translate(-50%, -50%); font-size: 170px; line-height: 1;
    color: #ff8a1f; text-shadow: 0 6px 0 #000, 0 0 40px rgba(255,138,31,.6); pointer-events: none; }
  #aviso { position: fixed; left: 50%; top: 22%; z-index: 70; transform: translateX(-50%); font-size: 46px; color: #39ff14;
    text-shadow: 0 3px 0 #000; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  #aviso.ver { opacity: 1; }
  #fin { position: fixed; left: 50%; top: 50%; z-index: 80; transform: translate(-50%, -50%) scale(.7); min-width: min(92vw, 380px);
    padding: 22px 30px; border-radius: 16px; text-align: center; background: rgba(0,0,0,.92); border: 2px solid #ff8a1f;
    box-shadow: 0 0 40px rgba(255,138,31,.5); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.2,1.6,.4,1); }
  #fin.ver { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  #fin h1 { font-weight: 400; font-size: 58px; color: #ff8a1f; }
  #fin ol { list-style: none; margin: 10px 0 16px; font: 700 15px monospace; text-align: left; }
  #fin li { display: flex; justify-content: space-between; gap: 18px; padding: 5px 8px; border-radius: 6px; color: #cfc8ff; }
  #fin li.vos { background: #4a3f96; color: #fff; }
  #fin button { display: block; width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; border: 1px solid #4a3f96; background: #1a1347;
    color: #fff; font: 700 15px inherit; cursor: pointer; }
  #fin button:hover, #fin button:first-of-type { background: #ff8a1f; border-color: #ff8a1f; color: #1a0d02; }

  #bGaraje { padding: 5px 12px; border-radius: 14px; background: #ff8a1f; border: 1px solid #ff8a1f; color: #1a0d02; font: 700 13px monospace; cursor: pointer; }
  /* garaje: abajo, para que se vea el vehículo girando */
  #garaje { position: fixed; left: 50%; bottom: 20px; z-index: 80; transform: translateX(-50%); width: min(96vw, 820px); padding: 14px 18px; border-radius: 16px;
    text-align: center; background: rgba(0,0,0,.88); border: 2px solid #ff8a1f; display: none; }
  #garaje.ver { display: block; }
  #garaje h1 { font-weight: 400; font-size: 34px; color: #ff8a1f; }
  #autos { display: flex; gap: 8px; margin: 10px 0; overflow-x: auto; }
  #autos button { flex: 1 0 128px; padding: 9px 10px; border-radius: 10px; border: 2px solid #4a3f96; background: #1a1347; color: #b3abe0;
    font: 700 11px monospace; text-align: left; cursor: pointer; }
  #autos button.activo { border-color: #39ff14; color: #fff; }
  #autos strong { display: block; margin-bottom: 5px; font: 400 22px Bangers, Impact, sans-serif; letter-spacing: .04em; color: #f4f1de; pointer-events: none; }
  #autos i { display: block; height: 6px; margin: 2px 0 5px; border-radius: 3px; background: #2a2350; pointer-events: none; }
  #autos i b { display: block; height: 100%; border-radius: 3px; background: #39ff14; }
  #largar { width: 100%; padding: 10px; border-radius: 10px; border: 0; background: #ff8a1f; color: #1a0d02; font: 700 16px inherit; cursor: pointer; }
  body:has(#garaje.ver) :is(#mapa, #ayuda, #velocidad, #cuenta, #puesto) { visibility: hidden; }
  @media (pointer: coarse) { #ayuda { bottom: 8px; } #mapa { width: 120px; height: 120px; bottom: 34px; } #puesto { font-size: 56px; } }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>

<canvas id="escena"></canvas>
<div id="cargando">…</div>

<div id="puesto" class="letra"></div>
<a id="salir" href="./"></a>
<nav id="pistas"></nav>
<div id="datos"><span id="vuelta"></span><span id="tiempo">0:00.00</span><span id="fps">-- FPS</span><button id="bGaraje" type="button"></button></div>
<div id="velocidad" class="letra"></div>
<canvas id="mapa" width="340" height="340"></canvas>
<div id="ayuda"></div>
<div id="cuenta" class="letra"></div>
<div id="aviso" class="letra"></div>
<div id="garaje"><h1 class="letra"></h1><div id="autos"></div><button id="largar" type="button"></button></div>
<div id="fin"><h1 class="letra"></h1><ol></ol><button id="otra" type="button"></button><button id="cambiar" type="button"></button><button id="volver" type="button"></button></div>

<script type="module" src="./carrera.js?v=3"></script>
</body>
</html>
